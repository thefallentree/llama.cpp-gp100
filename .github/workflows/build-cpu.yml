name: CI (cpu)

# The fork's only workflow: a Linux CPU build with RPC, and the tests that cover the fork's CPU-side changes
# (quant types, chat parser, checkpoint spread, DSpark cut, RPC graph cache). The CUDA sm_60 paths need a P100
# and are tested on the hardware.

on:
  workflow_dispatch:
  push:
    branches: [sm60]
  pull_request:
    branches: [sm60]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGGML_CUDA=OFF -DGGML_RPC=ON -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=ON -DLLAMA_CURL=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF
          cmake --build build -j $(nproc)

      - name: Test
        run: |
          cd build
          ctest --output-on-failure --timeout 600 \
            -R '^(test-quantize-fns|test-gguf|test-rope|test-chat|test-ckpt-spread|test-spec-dspark-cum|test-rpc-graph-cache|test-rpc-multi-server|test-sampling|test-batch-alloc)$'
